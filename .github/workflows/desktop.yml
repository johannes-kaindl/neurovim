# Desktop builds (Tauri) for macOS / Windows / Linux.
#
# IMPORTANT: runs ONLY on GitHub Actions — the Forgejo shared runners are
# Linux-only and can't build a macOS DMG / Windows .exe. This file takes effect
# now that the GitHub mirror exists (ADR-001 D5). A Forgejo workflow could
# at most build the Linux artifact.
#
# Trigger: tag `v*` (creates a draft release with the installers) or manual dispatch.
# Artifacts: macOS .dmg (universal), Windows .exe/.msi, Linux .AppImage/.deb.
# macOS Developer ID signing + notarization is wired below via the APPLE_* secrets; if
# those repo secrets are unset the macOS build is simply UNSIGNED (Gatekeeper warning on
# first launch, same as before — no breakage). Windows is still unsigned. See docs/dev/reference/desktop-ci.md.

name: desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/adapter-web/src-tauri -> target'

      - name: Install JS deps
        run: npm ci

      - name: Generate bundled content
        run: npm run build:content

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS Developer ID signing + notarization. Only consumed on the macOS job —
          # on Linux/Windows these are empty and ignored. If unset everywhere, the macOS
          # build stays unsigned (no failure). All are plain-string repo secrets.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/adapter-web
          tagName: ${{ github.ref_name }}
          releaseName: 'NeuroVim ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
