# Auto-deploy the web app to Codeberg Pages on every push to main.
# Builds dist/ and force-pushes it to the `pages` branch, which Codeberg serves at
# https://jkaindl.codeberg.page/neurovim/  (Codeberg lowercases the repo name).

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build web app
        run: |
          npm install
          npm run build:content
          npm run build:web
      - name: Publish dist to the pages branch
        run: |
          cd packages/adapter-web/dist
          touch .nojekyll
          git init -q -b pages
          git config user.email "actions@codeberg.org"
          git config user.name "Forgejo Actions"
          git add -A
          git commit -q -m "deploy: web app ($GITHUB_SHA)"
          git push -f "https://x-access-token:${TOKEN}@codeberg.org/${GITHUB_REPOSITORY}.git" pages:pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
