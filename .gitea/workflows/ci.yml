# Codeberg / Forgejo Actions — CI
# Gitea-compatible syntax; Codeberg reads .gitea/workflows/ and .forgejo/workflows/.
# Install → typecheck (all workspaces) → test → build (content → plugin → web).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
