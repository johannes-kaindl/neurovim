# Codeberg / Forgejo Actions — CI
# Gitea-kompatible Syntax; Codeberg liest .gitea/workflows/ und .forgejo/workflows/.
# Install → Typecheck (core+adapter) → Test (core+adapter) → Build (adapter → main.js).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
