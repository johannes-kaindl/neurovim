<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- NeuroVim app icon — Kuro terminal mark `>_`. Source for `tauri icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10160f"/>
      <stop offset="1" stop-color="#07090a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- squircle tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="224" ry="224" fill="none" stroke="#1f2a1c" stroke-width="8"/>
  <rect x="84" y="84" width="856" height="856" rx="150" ry="150" fill="none" stroke="#2bbe5e" stroke-opacity="0.16" stroke-width="3"/>
  <!-- the >_ mark -->
  <g filter="url(#glow)" font-family="Menlo, 'JetBrains Mono', monospace" font-weight="700" fill="#39ff7a">
    <text x="512" y="650" font-size="440" text-anchor="middle">&gt;_</text>
  </g>
</svg>
