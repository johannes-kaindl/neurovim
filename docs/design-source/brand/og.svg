<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Menlo, 'JetBrains Mono', monospace">
  <!-- NeuroVim Open-Graph card (1200x630) — link unfurls / itch.io / Codeberg Pages. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e0c"/>
      <stop offset="1" stop-color="#070908"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#scan)" opacity="0.14"/>
  <!-- diegetic corner brackets -->
  <g stroke="#39ff7a" stroke-width="3" fill="none">
    <path d="M44 44 h74 M44 44 v74"/>
    <path d="M1156 44 h-74 M1156 44 v74"/>
    <path d="M44 586 h74 M44 586 v-74"/>
    <path d="M1156 586 h-74 M1156 586 v-74"/>
  </g>
  <g filter="url(#glow)">
    <text x="90" y="300" font-size="118" font-weight="700" fill="#39ff7a" letter-spacing="4">&gt;_ NEUROVIM</text>
  </g>
  <text x="94" y="372" font-size="29" fill="#8aa68a" letter-spacing="1">A Vim-learning game wrapped in a cyberpunk spy-thriller.</text>
  <text x="94" y="476" font-size="24" fill="#d7e0d7" letter-spacing="2">CIPHER //</text>
  <text x="94" y="516" font-size="32" fill="#6dffa6" font-style="italic">"Master it, or die typing."</text>
  <text x="94" y="588" font-size="22" fill="#8aa68a">play in the browser · codeberg.org/jkaindl/NeuroVIM</text>
</svg>
